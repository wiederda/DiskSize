
[package]
name = "DiskSize"
version = "1.0.0"
edition = "2024"
description = "DiskSize – Disk Usage Analyzer"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
egui = "0.37"
sysinfo = { version = "0.37", features = ["disk"] }
rayon = "1.11"
rust_xlsxwriter = "0.102"
rfd = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
